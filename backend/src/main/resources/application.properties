# ===== 服务端口 =====
server.port=8080

# ===== 数据源（数据库连接）=====
spring.datasource.url=jdbc:mysql://localhost:3306/campus_erp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 真实密码放在本地文件里，不提交到仓库
spring.config.import=optional:application-local.properties

# ===== MyBatis =====
# 让数据库列 display_name 自动映射到 Java 字段 displayName
mybatis.configuration.map-underscore-to-camel-case=true
# 打印实际执行的 SQL，方便调试
logging.level.com.campus.erp=DEBUG
